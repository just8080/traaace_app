name: Build Desktop Apps (Windows, Linux & macOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which installers to build. One platform costs far fewer Actions minutes than all four (Mac builds count 10x).'
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos-arm64
          - macos-x64

# Read-only: these workflows only build and test.
permissions:
  contents: read

jobs:
  plan:
    name: Choose what to build
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WANTED: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          everything = [
            {"platform": "windows-latest", "os-name": "windows-x64",
             "artifact-path": "src-tauri/target/release/bundle/nsis/*.exe\nsrc-tauri/target/release/bundle/msi/*.msi"},
            {"platform": "ubuntu-22.04", "os-name": "linux-x64",
             "artifact-path": "src-tauri/target/release/bundle/deb/*.deb\nsrc-tauri/target/release/bundle/appimage/*.AppImage"},
            # Apple Silicon (M-series / arm64)
            {"platform": "macos-latest", "os-name": "macos-arm64",
             "artifact-path": "src-tauri/target/release/bundle/dmg/*.dmg\nsrc-tauri/target/release/bundle/macos/*.app"},
            # Intel Mac (x86_64)
            {"platform": "macos-15-intel", "os-name": "macos-x64",
             "artifact-path": "src-tauri/target/release/bundle/dmg/*.dmg\nsrc-tauri/target/release/bundle/macos/*.app"},
          ]
          wanted = os.environ["WANTED"] or "all"
          chosen = [e for e in everything if wanted == "all" or e["os-name"].startswith(wanted)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write("matrix=" + json.dumps(chosen) + "\n")
          PY

  build:
    name: Build (${{ matrix.os-name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux-specific dependencies required by Tauri v2 and WebKitGTK
      - name: Install Linux system dependencies
        if: startsWith(matrix.os-name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri desktop application
        run: pnpm tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TRAAACE-${{ matrix.os-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn